<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Som van 10 - Louie's Game</title>
    <style>
        :root { --grid-size: 10; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 10px;
            touch-action: manipulation;
            overflow-x: hidden;
        }

        /* STARTMENU */
        #menu-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .menu-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 85%;
            max-width: 350px;
            text-align: center;
        }

        /* STATISTIEKEN BOVENAAN */
        #ui-container {
            background: white;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 kolommen voor Score, Tijd, Fouten */
            gap: 5px;
            text-align: center;
            font-weight: bold;
        }

        .stat-item { padding: 5px; font-size: 0.9rem; border-bottom: 1px solid #eee; }
        .stat-label { display: block; font-size: 0.7rem; color: #7f8c8d; text-transform: uppercase; }
        
        .records-row {
            grid-column: span 3;
            display: flex;
            justify-content: space-around;
            padding-top: 8px;
            font-size: 0.8rem;
            color: #7f8c8d;
        }

        /* HET RASTER */
        #grid {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), 1fr); 
            gap: 4px;
            background-color: #bdc3c7;
            padding: 8px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px; 
            box-sizing: border-box;
            display: none;
        }

        .cell {
            aspect-ratio: 1 / 1; 
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: calc(40vw / var(--grid-size));
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            color: #2c3e50;
            user-select: none;
        }

        @media (min-width: 500px) { .cell { font-size: 24px; } }

        .cell.selected { background-color: #3498db; color: white; }
        .cell.error { background-color: #e74c3c !important; color: white !important; animation: shake 0.3s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .cell.hidden { visibility: hidden; pointer-events: none; }

        /* KNOPPEN */
        .level-btn {
            margin: 10px 0;
            padding: 15px;
            font-size: 1.1rem;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
        }
        .btn-easy { background-color: #27ae60; }
        .btn-medium { background-color: #f39c12; }
        .btn-hard { background-color: #e74c3c; }

        #message {
            margin: 10px 0;
            font-size: 1.1rem;
            color: #2c3e50;
            font-weight: bold;
            text-align: center;
            min-height: 1.5rem;
        }

        .menu-nav-btn {
            display: none;
            margin-top: 10px;
            padding: 10px 20px;
            background: #95a5a6;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="menu-overlay">
        <div class="menu-box">
            <h1 style="margin:0 0 10px 0; color:#2c3e50;">Som van 10</h1>
            <p>Kies een niveau, Louie:</p>
            <button class="level-btn btn-easy" onclick="startGame(6)">Makkelijk (6x6)</button>
            <button class="level-btn btn-medium" onclick="startGame(8)">Gemiddeld (8x8)</button>
            <button class="level-btn btn-hard" onclick="startGame(10)">Moeilijk (10x10)</button>
        </div>
    </div>

    <div id="ui-container">
        <div class="stats-grid">
            <div class="stat-item"><span class="stat-label">Punten</span><span id="score">0</span></div>
            <div class="stat-item"><span class="stat-label">Tijd</span><span id="timer">0</span>s</div>
            <div class="stat-item" style="color: #e74c3c;"><span class="stat-label">Fouten</span><span id="wrong-count">0</span></div>
            
            <div class="records-row">
                <div>Topscore: <span id="highscore">0</span></div>
                <div>Toptijd: <span id="besttime">--</span>s</div>
            </div>
        </div>
    </div>

    <div id="grid"></div>
    <div id="message"></div>
    <button id="back-btn" class="menu-nav-btn" onclick="showMenu()">Naar Menu</button>

    <script>
        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const wrongElement = document.getElementById('wrong-count');
        const highscoreElement = document.getElementById('highscore');
        const besttimeElement = document.getElementById('besttime');
        const messageElement = document.getElementById('message');
        const menuOverlay = document.getElementById('menu-overlay');
        const uiContainer = document.getElementById('ui-container');
        const backBtn = document.getElementById('back-btn');
        
        let score = 0;
        let seconds = 0;
        let wrongMoves = 0;
        let timerInterval;
        let selectedCell = null;
        let lastPairTime = 0;
        let gameActive = false;
        let currentSize = 10;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playErrorSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function speak(text) {
            const msg = new SpeechSynthesisUtterance();
            msg.text = text;
            msg.lang = 'nl-BE';
            const voices = window.speechSynthesis.getVoices();
            const voice = voices.find(v => v.lang === 'nl-BE') || voices.find(v => v.lang === 'nl-NL');
            if (voice) msg.voice = voice;
            window.speechSynthesis.speak(msg);
        }

        function showMenu() {
            menuOverlay.style.display = 'flex';
            uiContainer.style.display = 'none';
            gridElement.style.display = 'none';
            backBtn.style.display = 'none';
            clearInterval(timerInterval);
            gameActive = false;
        }

        function startGame(size) {
            initAudio();
            currentSize = size;
            document.documentElement.style.setProperty('--grid-size', size);
            
            menuOverlay.style.display = 'none';
            uiContainer.style.display = 'block';
            gridElement.style.display = 'grid';
            backBtn.style.display = 'block';
            
            initGame();
        }

        function initGame() {
            gridElement.innerHTML = '';
            score = 0;
            seconds = 0;
            wrongMoves = 0;
            gameActive = true;
            lastPairTime = Date.now();
            scoreElement.innerText = score;
            timerElement.innerText = seconds;
            wrongElement.innerText = wrongMoves;
            messageElement.innerText = '';
            selectedCell = null;
            
            const savedHighscore = localStorage.getItem('highscore_' + currentSize) || 0;
            const savedBestTime = localStorage.getItem('besttime_' + currentSize) || "--";
            highscoreElement.innerText = savedHighscore;
            besttimeElement.innerText = savedBestTime;

            const totalCells = currentSize * currentSize;
            for (let i = 0; i < totalCells; i++) {
                const val = Math.floor(Math.random() * 9) + 1;
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.innerText = val;
                cell.addEventListener('click', () => handleCellClick(cell));
                gridElement.appendChild(cell);
            }

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                timerElement.innerText = seconds;
            }, 1000);
        }

        function handleCellClick(cell) {
            if (!gameActive || cell.classList.contains('hidden') || cell.classList.contains('error')) return;
            initAudio();

            if (selectedCell === cell) {
                cell.classList.remove('selected');
                selectedCell = null;
                return;
            }

            if (!selectedCell) {
                selectedCell = cell;
                cell.classList.add('selected');
            } else {
                const val1 = parseInt(selectedCell.innerText);
                const val2 = parseInt(cell.innerText);

                if (val1 + val2 === 10) {
                    calculateScore(true);
                    selectedCell.classList.add('hidden');
                    cell.classList.add('hidden');
                    selectedCell.classList.remove('selected');
                    selectedCell = null;
                    checkGameOver();
                } else {
                    const c1 = selectedCell;
                    const c2 = cell;
                    c1.classList.add('error');
                    c2.classList.add('error');
                    c1.classList.remove('selected');
                    
                    wrongMoves++;
                    wrongElement.innerText = wrongMoves;
                    
                    playErrorSound();
                    calculateScore(false);
                    selectedCell = null;
                    setTimeout(() => {
                        c1.classList.remove('error');
                        c2.classList.remove('error');
                    }, 400);
                }
            }
        }

        function calculateScore(isCorrect) {
            if (isCorrect) {
                const now = Date.now();
                const timeDiff = (now - lastPairTime) / 1000;
                let points = Math.max(10, Math.floor(100 - (timeDiff * 5)));
                score += points;
                lastPairTime = now;
            } else {
                score = Math.max(0, score - 20);
            }
            scoreElement.innerText = score;
        }

        function checkGameOver() {
            const activeCells = Array.from(document.querySelectorAll('.cell:not(.hidden)'));
            let possibleMatch = false;
            
            for (let i = 0; i < activeCells.length; i++) {
                for (let j = i + 1; j < activeCells.length; j++) {
                    if (parseInt(activeCells[i].innerText) + parseInt(activeCells[j].innerText) === 10) {
                        possibleMatch = true;
                        break;
                    }
                }
                if (possibleMatch) break;
            }

            if (!possibleMatch) {
                gameActive = false;
                clearInterval(timerInterval);
                
                const oldHighscore = parseInt(localStorage.getItem('highscore_' + currentSize) || 0);
                const oldBestTime = parseInt(localStorage.getItem('besttime_' + currentSize) || 999999);
                let speech = "Game over. Goed gedaan Louie!";

                if (score > oldHighscore) {
                    localStorage.setItem('highscore_' + currentSize, score);
                    speech = "Nieuwe topscore voor Louie! Geweldig gedaan!";
                }

                if (seconds < oldBestTime) {
                    localStorage.setItem('besttime_' + currentSize, seconds);
                    besttimeElement.innerText = seconds;
                    if (score > oldHighscore) {
                        speech = "Een dubbel record voor Louie! Beste score en beste tijd!";
                    } else {
                        speech = "Een nieuwe recordtijd voor Louie! Wat ben je snel!";
                    }
                }

                messageElement.innerText = "Klaar! Fouten: " + wrongMoves;
                speak(speech);
            }
        }

        window.speechSynthesis.getVoices();
    </script>
</body>
</html>
