<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Som van 10 - Levels & Topscores</title>
    <style>
        :root {
            --grid-size: 10;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 10px;
            touch-action: manipulation;
        }

        /* Startmenu / Overlay */
        #menu-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(240, 242, 245, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
        }

        .menu-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 300px;
        }

        #ui-container {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .highscore-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 5px;
        }

        #grid {
            display: grid;
            /* Dynamisch aantal kolommen via JS */
            grid-template-columns: repeat(var(--grid-size), 1fr); 
            gap: 4px;
            background-color: #bdc3c7;
            padding: 8px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px; 
            box-sizing: border-box;
        }

        .cell {
            aspect-ratio: 1 / 1; 
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: calc(30vw / var(--grid-size)); /* Tekst past zich aan raster aan */
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            user-select: none;
            transition: all 0.2s;
            color: #2c3e50;
        }

        @media (min-width: 500px) { .cell { font-size: 20px; } }

        .cell.selected { background-color: #3498db; color: white; transform: scale(1.05); }
        .cell.error { background-color: #e74c3c !important; color: white !important; animation: shake 0.3s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .cell.hidden { visibility: hidden; pointer-events: none; }

        button {
            margin: 10px 0;
            padding: 12px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
        }

        button.btn-easy { background-color: #27ae60; }
        button.btn-medium { background-color: #f39c12; }
        button.btn-hard { background-color: #e74c3c; }

        #message {
            margin-top: 10px;
            font-size: 1.1rem;
            color: #2c3e50;
            font-weight: bold;
            text-align: center;
            min-height: 1.5rem;
        }
    </style>
</head>
<body>

    <div id="menu-overlay">
        <div class="menu-content">
            <h2>Som van 10</h2>
            <p>Kies een niveau:</p>
            <button class="btn-easy" onclick="startGame(6)">Makkelijk (6x6)</button>
            <button class="btn-medium" onclick="startGame(8)">Gemiddeld (8x8)</button>
            <button class="btn-hard" onclick="startGame(10)">Moeilijk (10x10)</button>
        </div>
    </div>

    <div id="ui-container">
        <div class="stats-row">
            <div>Score: <span id="score">0</span></div>
            <div>Tijd: <span id="timer">0</span>s</div>
        </div>
        <div class="highscore-label">Persoonlijk record (dit level): <span id="highscore">0</span></div>
    </div>

    <div id="grid"></div>

    <div id="message"></div>
    <button onclick="showMenu()" style="background-color: #95a5a6; max-width: 200px;">Menu</button>

    <script>
        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const highscoreElement = document.getElementById('highscore');
        const messageElement = document.getElementById('message');
        const menuOverlay = document.getElementById('menu-overlay');
        
        let score = 0;
        let seconds = 0;
        let timerInterval;
        let selectedCell = null;
        let lastPairTime = 0;
        let gameActive = false;
        let currentSize = 10;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playErrorSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function speak(text) {
            const msg = new SpeechSynthesisUtterance();
            msg.text = text;
            const voices = window.speechSynthesis.getVoices();
            const voice = voices.find(v => v.lang === 'nl-BE') || voices.find(v => v.lang === 'nl-NL');
            if (voice) msg.voice = voice;
            msg.lang = 'nl-BE';
            window.speechSynthesis.speak(msg);
        }

        function showMenu() {
            menuOverlay.style.display = 'flex';
            clearInterval(timerInterval);
            gameActive = false;
        }

        function startGame(size) {
            currentSize = size;
            document.documentElement.style.setProperty('--grid-size', size);
            menuOverlay.style.display = 'none';
            initGame();
        }

        function initGame() {
            gridElement.innerHTML = '';
            score = 0;
            seconds = 0;
            gameActive = true;
            lastPairTime = Date.now();
            scoreElement.innerText = score;
            timerElement.innerText = seconds;
            messageElement.innerText = '';
            
            // Laad topscore voor dit specifieke level
            const savedHighscore = localStorage.getItem('highscore_' + currentSize) || 0;
            highscoreElement.innerText = savedHighscore;

            const totalCells = currentSize * currentSize;
            for (let i = 0; i < totalCells; i++) {
                const val = Math.floor(Math.random() * 9) + 1;
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.innerText = val;
                cell.onclick = () => handleCellClick(cell);
                gridElement.appendChild(cell);
            }

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                timerElement.innerText = seconds;
            }, 1000);
        }

        function handleCellClick(cell) {
            if (!gameActive || cell.classList.contains('hidden') || cell.classList.contains('error')) return;

            if (selectedCell === cell) {
                cell.classList.remove('selected');
                selectedCell = null;
                return;
