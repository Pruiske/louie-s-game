<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Apple Web App instellingen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Som van 10">
    
    <title>Som van 10 - Louie's Game</title>
    <style>
        :root { --grid-size: 10; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: env(safe-area-inset-top) 10px 20px 10px;
            touch-action: manipulation;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* STARTMENU */
        #menu-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .menu-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 85%;
            max-width: 350px;
            text-align: center;
        }

        #ui-container {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            display: none;
        }

        .stats-main {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
            margin-bottom: 10px;
        }

        .stat-box { display: flex; flex-direction: column; align-items: center; font-weight: bold; }
        .stat-value { font-size: 1.2rem; color: #2c3e50; }
        .stat-label { font-size: 0.7rem; color: #7f8c8d; text-transform: uppercase; }
        .wrong-stat { color: #e74c3c; border-left: 1px solid #eee; border-right: 1px solid #eee; }

        .records-row {
            display: flex;
            justify-content: space-around;
            padding-top: 10px;
            border-top: 1px solid #eee;
            font-size: 0.8rem;
            color: #95a5a6;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), 1fr); 
            gap: 4px;
            background-color: #bdc3c7;
            padding: 8px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px; 
            box-sizing: border-box;
            display: none;
        }

        .cell {
            aspect-ratio: 1 / 1; 
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: calc(45vw / var(--grid-size));
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            color: #2c3e50;
            transition: background-color 0.1s;
        }

        @media (min-width: 500px) { .cell { font-size: 24px; } }

        .cell.selected { background-color: #3498db; color: white; }
        .cell.error { background-color: #e74c3c !important; color: white !important; animation: shake 0.3s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .cell.hidden { visibility: hidden; pointer-events: none; }

        .level-btn {
            margin: 10px 0;
            padding: 18px;
            font-size: 1.2rem;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 15px;
            width: 100%;
            font-weight: bold;
            -webkit-appearance: none;
        }
        .btn-easy { background-color: #27ae60; }
        .btn-medium { background-color: #f39c12; }
        .btn-hard { background-color: #e74c3c; }

        #message {
            margin: 10px 0;
            font-size: 1.1rem;
            color: #2c3e50;
            font-weight: bold;
            text-align: center;
            min-height: 1.5rem;
        }

        .menu-nav-btn {
            display: none;
            margin-top: 10px;
            padding: 12px 25px;
            background: #95a5a6;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="menu-overlay">
        <div class="menu-box">
            <h1 style="margin:0 0 10px 0; color:#2c3e50;">Som van 10</h1>
            <p>Welkom Louie!</p>
            <button class="level-btn btn-easy" onclick="clickStart(6)">Makkelijk (6x6)</button>
            <button class="level-btn btn-medium" onclick="clickStart(8)">Gemiddeld (8x8)</button>
            <button class="level-btn btn-hard" onclick="clickStart(10)">Moeilijk (10x10)</button>
        </div>
    </div>

    <div id="ui-container">
        <div class="stats-main">
            <div class="stat-box">
                <span class="stat-label">Punten</span>
                <span id="score" class="stat-value">0</span>
            </div>
            <div class="stat-box wrong-stat">
                <span class="stat-label">Fouten</span>
                <span id="wrong-count" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Tijd</span>
                <span id="timer" class="stat-value">0</span>
            </div>
        </div>
        <div class="records-row">
            <div>Record: <span id="highscore">0</span></div>
            <div>Snelst: <span id="besttime">--</span>s</div>
        </div>
    </div>

    <div id="grid"></div>
    <div id="message"></div>
    <button id="back-btn" class="menu-nav-btn" onclick="showMenu()">Menu</button>

    <script>
        // GLOBALE VARIABELEN
        let score = 0, seconds = 0, wrongMoves = 0, timerInterval, selectedCell = null, 
            lastPairTime = 0, gameActive = false, currentSize = 10, audioCtx = null;

        // ELEMENTEN
        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const wrongElement = document.getElementById('wrong-count');
        const highscoreElement = document.getElementById('highscore');
        const besttimeElement = document.getElementById('besttime');
        const messageElement = document.getElementById('message');
        const menuOverlay = document.getElementById('menu-overlay');
        const uiContainer = document.getElementById('ui-container');
        const backBtn = document.getElementById('back-btn');

        // iOS AUDIO UNLOCK
        function clickStart(size) {
            // 1. Initialiseer Audio direct op de klik
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            // 2. Initialiseer Spraak (stille start voor iOS)
            const silentMsg = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(silentMsg);

            // 3. Start het spel
            startGame(size);
        }

        function playErrorSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) { console.log("Audio error"); }
        }

        function speak(text) {
            try {
                window.speechSynthesis.cancel(); // Stop lopende spraak
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'nl-BE';
                const voices = window.speechSynthesis.getVoices();
                const voice = voices.find(v => v.lang === 'nl-BE') || voices.find(v => v.lang === 'nl-NL');
                if (voice) msg.voice = voice;
                window.speechSynthesis.speak(msg);
            } catch(e) { console.log("Speech error"); }
        }

        function showMenu() {
            menuOverlay.style.display = 'flex';
            uiContainer.style.display = 'none';
            gridElement.style.display = 'none';
            backBtn.style.display = 'none';
            clearInterval(timerInterval);
            gameActive = false;
        }

        function startGame(size) {
            currentSize = size;
            document.documentElement.style.setProperty('--grid-size', size);
            menuOverlay.style.display = 'none';
            uiContainer.style.display = 'block';
            gridElement.style.display = 'grid';
            backBtn.style.display = 'block';
            initGame();
        }

        function initGame() {
            gridElement.innerHTML = '';
            score = 0; seconds = 0; wrongMoves = 0;
            gameActive = true;
            lastPairTime = Date.now();
            selectedCell = null;
            
            scoreElement.innerText = "0";
            timerElement.innerText = "0";
            wrongElement.innerText = "0";
            messageElement.innerText = '';
            
            highscoreElement.innerText = localStorage.getItem('highscore_' + currentSize) || 0;
            besttimeElement.innerText = localStorage.getItem('besttime_' + currentSize) || "--";

            for (let i = 0; i < currentSize * currentSize; i++) {
                const val = Math.floor(Math.random() * 9) + 1;
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.innerText = val;
                cell.addEventListener('click', () => handleCellClick(cell));
                gridElement.appendChild(cell);
            }

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                timerElement.innerText = seconds;
            }, 1000);
        }

        function handleCellClick(cell) {
            if (!gameActive || cell.classList.contains('hidden') || cell.classList.contains('error')) return;
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            if (selectedCell === cell) {
                cell.classList.remove('selected');
                selectedCell = null;
                return;
            }

            if (!selectedCell) {
                selectedCell = cell;
                cell.classList.add('selected');
            } else {
                const val1 = parseInt(selectedCell.innerText);
                const val2 = parseInt(cell.innerText);

                if (val1 + val2 === 10) {
                    const now = Date.now();
                    const points = Math.max(10, Math.floor(100 - ((now - lastPairTime)/1000 * 5)));
                    score += points;
                    lastPairTime = now;
                    scoreElement.innerText = score;

                    selectedCell.classList.add('hidden');
                    cell.classList.add('hidden');
                    selectedCell.classList.remove('selected');
                    selectedCell = null;
                    checkGameOver();
                } else {
                    const c1 = selectedCell, c2 = cell;
                    c1.classList.add('error'); c2.classList.add('error');
                    c1.classList.remove('selected');
                    wrongMoves++;
                    wrongElement.innerText = wrongMoves;
                    score = Math.max(0, score - 20);
                    scoreElement.innerText = score;
                    playErrorSound();
                    selectedCell = null;
                    setTimeout(() => { c1.classList.remove('error'); c2.classList.remove('error'); }, 400);
                }
            }
        }

        function checkGameOver() {
            const cells = Array.from(document.querySelectorAll('.cell:not(.hidden)'));
            let match = false;
            for (let i = 0; i < cells.length; i++) {
                for (let j = i + 1; j < cells.length; j++) {
                    if (parseInt(cells[i].innerText) + parseInt(cells[j].innerText) === 10) {
                        match = true; break;
                    }
                }
                if (match) break;
            }

            if (!match) {
                gameActive = false;
                clearInterval(timerInterval);
                const oldHigh = parseInt(localStorage.getItem('highscore_' + currentSize) || 0);
                const oldTime = parseInt(localStorage.getItem('besttime_' + currentSize) || 9999);
                let txt = "Goed gedaan Louie!";
                if (score > oldHigh) {
                    localStorage.setItem('highscore_' + currentSize, score);
                    txt = "Nieuwe topscore voor Louie!";
                }
                if (seconds < oldTime && cells.length === 0) {
                    localStorage.setItem('besttime_' + currentSize, seconds);
                }
                messageElement.innerText = "Klaar! Fouten: " + wrongMoves;
                speak(txt);
            }
        }
        window.speechSynthesis.getVoices();
    </script>
</body>
</html>
