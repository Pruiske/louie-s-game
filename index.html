<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Louie's Rekentrainer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');

        :root {
            --primary: #6c5ce7;
            --secondary: #00cec9;
            --bridge-color: #fd9644;
            --accent: #f1c40f;
            --danger: #ff7675;
            --bg-gradient: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: #2d3436;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .header-container { text-align: center; margin: 10px 0; width: 100%; }
        h1 { margin: 0; font-size: clamp(1.5rem, 6vw, 2.2rem); color: var(--primary); text-shadow: 2px 2px 0px white; }
        .version { font-size: 0.8rem; color: #636e72; font-weight: 600; }

        .screen { display: none; width: 100%; max-width: 550px; padding: 10px; box-sizing: border-box; flex-direction: column; align-items: center; }
        .active { display: flex; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* UI Stats */
        .stats-wrapper {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
            background: var(--card-bg); padding: 10px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; margin-bottom: 15px; border: 2px solid white;
        }
        .stat-item { display: flex; align-items: center; gap: 5px; font-size: 0.9rem; font-weight: 600; justify-content: center; }

        /* Knoppen */
        .btn {
            width: 100%; padding: clamp(12px, 4vw, 18px); margin: 6px 0; border: none; border-radius: 15px;
            background: white; color: var(--primary); font-size: clamp(0.9rem, 4vw, 1.1rem); font-weight: 600;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:active { transform: scale(0.98); background: #f0f0f0; }
        .btn-orange { color: var(--bridge-color); border: 2px solid var(--bridge-color); }
        .btn-back { background: #dfe6e9; color: #636e72; margin-top: 15px; width: auto; min-width: 110px; padding: 10px; font-size: 0.9rem; }

        /* Raster */
        #grid-container { position: relative; background: rgba(0,0,0,0.05); border-radius: 12px; border: 4px solid rgba(255,255,255,0.5); margin: 0 auto; }
        .cell { position: absolute; background: white; display: flex; justify-content: center; align-items: center; font-size: 1.1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.3s; color: var(--primary); box-shadow: 0 3px 0 #dfe6e9; box-sizing: border-box; }
        .cell.selected { background: var(--primary) !important; color: white !important; }
        .cell.cpu-hint { background: var(--accent) !important; border: 2px solid #f39c12; }
        .cell.exploding { transform: scale(0); opacity: 0; pointer-events: none; }

        /* BRUGMETHODE RESPONSIVE */
        .bridge-box { 
            background: white; padding: clamp(15px, 5vw, 25px) 10px; border-radius: 25px; 
            width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
        }
        .sum-row { font-size: clamp(2rem, 10vw, 3rem); font-weight: 600; color: var(--primary); margin-bottom: 5px; }
        .split-svg { width: 100%; max-width: 180px; height: 50px; }
        .split-line { stroke: var(--bridge-color); stroke-width: 5; stroke-linecap: round; fill: none; }
        
        .work-row { 
            display: flex; align-items: center; justify-content: center; 
            gap: clamp(4px, 2vw, 10px); width: 100%; font-size: clamp(1.2rem, 5vw, 1.8rem); font-weight: 600; 
        }
        
        .num-input { 
            width: clamp(45px, 14vw, 60px); height: clamp(45px, 14vw, 60px); 
            border: 3px solid #eee; border-radius: 12px;
            text-align: center; font-size: clamp(1.2rem, 5vw, 1.8rem); font-family: 'Fredoka'; 
            color: var(--primary); outline: none; background: white;
            -webkit-appearance: none; margin: 0;
        }
        .num-input:focus { border-color: var(--secondary); background: #fff; }
        .num-input.correct { border-color: var(--secondary); background: #e8fffb; color: #00b894; }
        .num-input[readonly] { background-color: #f9f9f9; color: #aaa; }

        #msg { height: 40px; margin-top: 10px; font-size: 1.1rem; font-weight: 600; text-align: center; color: var(--primary); }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Louie's Rekentrainer</h1>
        <div class="version">Versie 3.2</div>
    </div>

    <!-- 1. HOOFDMENU -->
    <div id="main-menu" class="screen active">
        <h2 style="margin-bottom: 15px; font-size: 1.2rem;">Maak een keuze:</h2>
        <button class="btn" onclick="openMode('som10')">✨ De som van 10</button>
        <button class="btn btn-orange" onclick="openMode('bridge')">🌉 Optellen over 10</button>
    </div>

    <!-- 2. SUBMENU SOM VAN 10 -->
    <div id="som10-menu" class="screen">
        <button class="btn" onclick="prepareGrid(1)">🧩 Klassiek Raster</button>
        <button class="btn" onclick="prepareGrid(2)">🤖 Computer Kiest</button>
        <button class="btn" onclick="startKeyboardRace()">⌨️ Toetsenbord Race</button>
        <button class="btn" onclick="prepareGrid(4)">🪐 Gravity Mode</button>
        <button class="btn btn-back" onclick="showScreen('main-menu')">Terug</button>
    </div>

    <!-- 3. LEVEL SELECTIE -->
    <div id="level-screen" class="screen">
        <h2 id="level-title" style="font-size: 1.2rem;">Kies een niveau</h2>
        <button class="btn" onclick="finalizeGridStart(6)">🟢 Makkelijk (6x6)</button>
        <button class="btn" onclick="finalizeGridStart(8)">🟡 Gemiddeld (8x8)</button>
        <button class="btn" onclick="finalizeGridStart(10)">🔴 Moeilijk (10x10)</button>
        <button class="btn btn-back" onclick="showScreen('som10-menu')">Terug</button>
    </div>

    <!-- 4. BRUGMETHODE SPEL -->
    <div id="bridge-game-screen" class="screen">
        <div class="stats-wrapper">
            <div class="stat-item">⭐ <span id="bridge-score">0</span></div>
            <div class="stat-item">⏱️ <span id="bridge-timer">0</span>s</div>
        </div>
        <div class="bridge-box">
            <div class="sum-row"><span id="b-n1">8</span>+<span id="b-n2" style="color:var(--bridge-color)">5</span>=?</div>
            <svg class="split-svg" viewBox="0 0 200 60">
                <line x1="100" y1="5" x2="55" y2="55" class="split-line" />
                <line x1="100" y1="5" x2="145" y2="55" class="split-line" />
            </svg>
            <div class="work-row">
                <span id="c-n1">8</span>+<input type="number" id="s1" class="num-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off">+<input type="number" id="s2" class="num-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off">=<input type="number" id="s3" class="num-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            </div>
            <div id="bridge-hint" style="margin-top:10px; font-size: 0.9rem; font-weight:600; color:#636e72; height: 1.2em;"></div>
        </div>
        <button class="btn btn-back" onclick="showScreen('main-menu')">🏠 Menu</button>
    </div>

    <!-- 5. GRID & KEYBOARD SPEL SCHERM -->
    <div id="game-screen" class="screen">
        <div class="stats-wrapper">
            <div class="stat-item">⭐ <span id="stat-score">0</span></div>
            <div class="stat-item">⏱️ <span id="stat-timer">0</span>s</div>
            <div class="stat-item">❌ <span id="stat-errors">0</span></div>
            <div class="stat-item">🏆 <span id="stat-high">0</span></div>
        </div>
        <div id="grid-container"></div>
        <div id="kb-area" style="display:none; background:white; padding:20px; border-radius:20px; width:100%; text-align:center; box-sizing:border-box;">
            <span id="kb-n1" style="font-size:2rem; font-weight:600;">?</span> 
            <span style="font-size:2rem;">+</span> 
            <input type="number" id="kb-input" class="num-input" style="width:70px; height:60px; font-size:2rem;" inputmode="numeric" pattern="[0-9]*" autocomplete="off"> 
            <span style="font-size:2rem;">= 10</span>
        </div>
        <div id="msg"></div>
        <button id="retry-btn" class="btn" style="background:var(--secondary); color:white; display:none;" onclick="restartGame()">🔄 Opnieuw</button>
        <button class="btn btn-back" onclick="showScreen('main-menu')">🏠 Menu</button>
    </div>

    <script>
        let config = { mode: '', type: 0, size: 8 };
        let state = { score: 0, errors: 0, seconds: 0, lastTime: 0, selected: null, cpuTarget: null, isGameOver: false };
        let bData = { n1: 0, n2: 0, s1: 0, s2: 0, tot: 0 };
        let timerInterval;
        let grid = [];

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(id);
            if(target) target.classList.add('active');
            clearInterval(timerInterval);
            state.isGameOver = false;
        }

        function openMode(mode) {
            config.mode = mode;
            if(mode === 'som10') { showScreen('som10-menu'); } 
            else { showScreen('bridge-game-screen'); startBridge(); }
        }

        function startBridge() {
            state.score = 0; state.seconds = 0;
            document.getElementById('bridge-score').innerText = "0";
            nextBridgeTask();
            startTimer('bridge-timer');
        }

        function nextBridgeTask() {
            bData.n1 = Math.floor(Math.random() * 4) + 6;
            bData.n2 = Math.floor(Math.random() * 4) + 5;
            bData.s1 = 10 - bData.n1;
            bData.s2 = bData.n2 - bData.s1;
            bData.tot = bData.n1 + bData.n2;

            document.getElementById('b-n1').innerText = bData.n1;
            document.getElementById('b-n2').innerText = bData.n2;
            document.getElementById('c-n1').innerText = bData.n1;
            
            ['s1', 's2', 's3'].forEach(id => { 
                const el = document.getElementById(id);
                el.value = ""; el.classList.remove('correct'); el.readOnly = true;
            });

            const f1 = document.getElementById('s1');
            f1.readOnly = false;
            f1.focus();
            document.getElementById('bridge-hint').innerText = `Maak 10: ${bData.n1} + ...`;

            f1.oninput = (e) => { if(parseInt(e.target.value) === bData.s1) moveBridgeFocus(e.target, 's2', `Splits de ${bData.n2}...`); };
            document.getElementById('s2').oninput = (e) => { if(parseInt(e.target.value) === bData.s2) moveBridgeFocus(e.target, 's3', `Tel alles samen...`); };
            document.getElementById('s3').oninput = (e) => { if(parseInt(e.target.value) === bData.tot) {
                e.target.classList.add('correct');
                e.target.readOnly = true;
                state.score += 50;
                document.getElementById('bridge-score').innerText = state.score;
                setTimeout(nextBridgeTask, 500); 
            }};
        }

        function moveBridgeFocus(cur, nextId, hint) {
            cur.classList.add('correct');
            cur.readOnly = true;
            const next = document.getElementById(nextId);
            next.readOnly = false;
            next.focus();
            document.getElementById('bridge-hint').innerText = hint;
        }

        function prepareGrid(type) { config.type = type; showScreen('level-screen'); }
        function finalizeGridStart(size) { config.size = size; startActualGame('grid'); }
        function startKeyboardRace() { config.type = 3; startActualGame('kb'); }

        function startActualGame(uiType) {
            state.score = 0; state.errors = 0; state.seconds = 0; state.lastTime = Date.now();
            state.isGameOver = false;
            showScreen('game-screen');
            document.getElementById('grid-container').style.display = uiType === 'grid' ? 'block' : 'none';
            document.getElementById('kb-area').style.display = uiType === 'kb' ? 'block' : 'none';
            document.getElementById('retry-btn').style.display = 'none';
            document.getElementById('msg').innerText = "";
            updateStats();
            if(uiType === 'grid') {
                const w = Math.min(window.innerWidth - 30, 460);
                initGrid(Math.floor(w / config.size));
            } else { initKeyboard(); }
            startTimer('stat-timer');
        }

        function initGrid(cellSize) {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            container.style.width = (config.size * cellSize) + 'px';
            container.style.height = (config.size * cellSize) + 'px';
            grid = [];
            let vals = [];
            for(let i=0; i<(config.size*config.size)/2; i++) {
                let v = Math.floor(Math.random()*9)+1; vals.push(v, 10-v);
            }
            vals.sort(() => Math.random() - 0.5);
            for(let r=0; r<config.size; r++) {
                for(let c=0; c<config.size; c++) {
                    const val = vals[r*config.size + c];
                    const el = document.createElement('div');
                    el.className = 'cell'; el.innerText = val;
                    el.style.width = (cellSize-4)+'px'; el.style.height = (cellSize-4)+'px';
                    el.style.top = (r*cellSize+2)+'px'; el.style.left = (c*cellSize+2)+'px';
                    const obj = { r, c, val, el, cellSize };
                    el.onclick = () => onCellClick(obj);
                    container.appendChild(el);
                    grid.push(obj);
                }
            }
            if(config.type === 2) setTimeout(cpuPick, 600);
        }

        function onCellClick(clicked) {
            if(state.isGameOver) return;
            if(config.type === 2) {
                if(state.cpuTarget && clicked.val + state.cpuTarget.val === 10 && clicked !== state.cpuTarget) {
                    removePair(clicked, state.cpuTarget); state.cpuTarget = null;
                    if(!checkWin()) setTimeout(cpuPick, 500);
                } else { state.errors++; updateStats(); }
                return;
            }
            if(!state.selected) { state.selected = clicked; clicked.el.classList.add('selected'); }
            else {
                if(state.selected === clicked) { clicked.el.classList.remove('selected'); state.selected = null; }
                else if(state.selected.val + clicked.val === 10) { removePair(state.selected, clicked); state.selected = null; checkWin(); }
                else { state.errors++; updateStats(); state.selected.el.classList.remove('selected'); state.selected = null; }
            }
        }

        function removePair(c1, c2) {
            const now = Date.now();
            state.score += Math.max(10, Math.floor(100 - ((now - state.lastTime)/1000)*8));
            state.lastTime = now; updateStats();
            c1.el.classList.add('exploding'); c2.el.classList.add('exploding');
            setTimeout(() => {
                c1.el.remove(); c2.el.remove();
                grid = grid.filter(c => c !== c1 && c !== c2);
                if(config.type === 4) applyGravity();
                checkWin();
            }, 300);
        }

        function applyGravity() {
            for(let c=0; c<config.size; c++) {
                let col = grid.filter(x => x.c === c).sort((a,b) => b.r - a.r);
                col.forEach((cell, idx) => {
                    cell.r = (config.size - 1) - idx;
                    cell.el.style.top = (cell.r * cell.cellSize + 2) + 'px';
                });
            }
        }

        function cpuPick() {
            if(state.isGameOver) return;
            let p = [];
            for(let i=0; i<grid.length; i++) {
                for(let j=i+1; j<grid.length; j++) if(grid[i].val + grid[j].val === 10) p.push([grid[i], grid[j]]);
            }
            if(p.length > 0) {
                state.cpuTarget = p[Math.floor(Math.random()*p.length)][0];
                state.cpuTarget.el.classList.add('cpu-hint');
            }
        }

        function initKeyboard() {
            const input = document.getElementById('kb-input');
            const n1el = document.getElementById('kb-n1');
            let n1 = Math.floor(Math.random()*9)+1;
            n1el.innerText = n1;
            input.value = ""; input.focus();
            input.oninput = () => {
                if(parseInt(input.value) + n1 === 10) {
                    state.score += 50; state.lastTime = Date.now(); updateStats();
                    n1 = Math.floor(Math.random()*9)+1; n1el.innerText = n1;
                    input.value = ""; input.focus();
                } else if(input.value.length >= 1) {
                    state.errors++; updateStats(); input.value = "";
                }
            };
        }

        function updateStats() {
            const sScore = document.getElementById('stat-score');
            const sErrors = document.getElementById('stat-errors');
            const sHigh = document.getElementById('stat-high');
            if(sScore) sScore.innerText = state.score;
            if(sErrors) sErrors.innerText = state.errors;
            if(sHigh) {
                const key = `rec_v32_${config.type}_${config.size}`;
                let high = localStorage.getItem(key) || 0;
                if(state.score > high) { high = state.score; localStorage.setItem(key, high); }
                sHigh.innerText = high;
            }
        }

        function startTimer(id) {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                state.seconds++;
                const el = document.getElementById(id);
                if(el) el.innerText = state.seconds;
            }, 1000);
        }

        function checkWin() {
            let possible = false;
            for(let i=0; i<grid.length; i++) {
                for(let j=i+1; j<grid.length; j++) if(grid[i].val + grid[j].val === 10) possible = true;
            }
            if(grid.length === 0 || !possible) {
                state.isGameOver = true; clearInterval(timerInterval);
                document.getElementById('msg').innerText = grid.length === 0 ? "🎉 GEWONNEN!" : "⛔ STOP!";
                document.getElementById('retry-btn').style.display = 'flex';
                return true;
            }
            return false;
        }

        function restartGame() {
            if(config.type === 3) startActualGame('kb'); else startActualGame('grid');
        }

        function exitGame() { showScreen('main-menu'); }
    </script>
</body>
</html>
