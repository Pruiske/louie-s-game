<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rekenhub - Versie 2.7</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');

        :root {
            --primary: #6c5ce7;
            --secondary: #00cec9;
            --bridge-color: #fd9644;
            --accent: #f1c40f;
            --danger: #ff7675;
            --bg-gradient: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: #2d3436;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation; /* Voorkomt inzoomen bij dubbel tikken */
        }

        .header-container { text-align: center; margin: 10px 0; }
        h1 { margin: 0; font-size: 2rem; color: var(--primary); }
        .version { font-size: 0.9rem; color: #636e72; font-weight: 600; margin-top: -5px; }

        .screen { display: none; width: 100%; max-width: 550px; padding: 15px; box-sizing: border-box; flex-direction: column; align-items: center; }
        .active { display: flex; animation: fadeIn 0.4s ease-out; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Algemene UI */
        #stats-bar, #stats-bar-bridge {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
            background: var(--card-bg); padding: 10px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; margin-bottom: 15px; border: 2px solid white;
        }
        .stat-item { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 600; justify-content: center; }

        .btn {
            width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 12px;
            background: white; color: var(--primary); font-size: 1.1rem; font-weight: 600;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:active { transform: scale(0.98); }
        .btn-orange { color: var(--bridge-color); border: 2px solid var(--bridge-color); }
        .btn-back { background: #dfe6e9; color: #636e72; margin-top: 15px; width: auto; min-width: 120px; padding: 10px; }

        /* Som van 10 CSS */
        #grid-container { position: relative; background: rgba(0,0,0,0.05); border-radius: 12px; border: 5px solid rgba(255,255,255,0.5); }
        .cell { position: absolute; background: white; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: top 0.5s, left 0.3s, background 0.3s; color: var(--primary); box-shadow: 0 3px 0 #dfe6e9; }
        .cell.selected { background: var(--primary) !important; color: white !important; }
        .cell.cpu-hint { background: var(--accent) !important; animation: cpuPulse 1s infinite alternate; z-index: 5; border: 2px solid #f39c12; }
        @keyframes cpuPulse { from { transform: scale(1); } to { transform: scale(1.08); } }
        .cell.exploding { transform: scale(0); opacity: 0; pointer-events: none; }

        /* BRUGMETHODE */
        .bridge-container { background: white; padding: 25px 15px; border-radius: 25px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; }
        .bridge-sum-display { font-size: 2.5rem; font-weight: 600; color: var(--primary); display: flex; gap: 10px; margin-bottom: 5px; }
        .second-number { color: var(--bridge-color); }
        .split-svg { width: 160px; height: 50px; margin: -5px 0; }
        .split-line { stroke: var(--bridge-color); stroke-width: 4; stroke-linecap: round; }
        .bridge-work-row { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1.5rem; font-weight: 600; }
        
        /* Input styling voor keyboard focus */
        .bridge-input, #kb-input { 
            width: 55px; height: 55px; border: 3px solid #eee; border-radius: 12px;
            text-align: center; font-size: 1.6rem; font-family: 'Fredoka'; 
            color: var(--primary); outline: none; background: white;
        }
        .bridge-input:focus, #kb-input:focus { border-color: var(--secondary); background: #fff; }
        .bridge-input.correct { border-color: var(--secondary); background: #e8fffb; color: #00b894; }

        #bridge-hint { margin-top: 15px; font-size: 1rem; color: #636e72; font-weight: 600; }
        #msg { height: 40px; margin-top: 10px; font-size: 1.2rem; font-weight: 600; text-align: center; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>🔢 Reken Trainer</h1>
        <div class="version">Versie 2.7</div>
    </div>

    <!-- HOOFDMENU -->
    <div id="main-mode-screen" class="screen active">
        <h2 style="margin-bottom: 20px;">Kies je uitdaging:</h2>
        <button class="btn" onclick="openSomVan10()">✨ De som van 10</button>
        <button class="btn btn-orange" onclick="openBrugmethode()">🌉 Optellen over 10 (Brug)</button>
    </div>

    <!-- MENU SOM VAN 10 -->
    <div id="menu-screen" class="screen">
        <button class="btn" onclick="showLevelSelect(1)">🧩 Klassiek Raster</button>
        <button class="btn" onclick="showLevelSelect(2)">🤖 Computer Kiest</button>
        <button class="btn" onclick="openKeyboardRace()">⌨️ Toetsenbord Race</button>
        <button class="btn" onclick="showLevelSelect(4)">🪐 Gravity Mode</button>
        <button class="btn btn-back" onclick="showScreen('main-mode-screen')">Terug</button>
    </div>

    <!-- BRUGMETHODE SCHERM -->
    <div id="bridge-screen" class="screen">
        <div id="stats-bar-bridge">
            <div class="stat-item">⭐ <span id="bridge-score">0</span></div>
            <div class="stat-item">⏱️ <span id="bridge-timer">0</span>s</div>
        </div>
        <div class="bridge-container">
            <div class="bridge-sum-display">
                <span id="b-main-n1">8</span> + <span id="b-main-n2" class="second-number">5</span> = ?
            </div>
            <svg class="split-svg" viewBox="0 0 200 60">
                <line x1="100" y1="5" x2="45" y2="55" class="split-line" />
                <line x1="100" y1="5" x2="155" y2="55" class="split-line" />
            </svg>
            <div class="bridge-work-row">
                <span id="calc-n1">8</span> + 
                <input type="number" id="step1" class="bridge-input" inputmode="numeric" pattern="[0-9]*" placeholder="?"> + 
                <input type="number" id="step2" class="bridge-input" inputmode="numeric" pattern="[0-9]*" placeholder="?"> = 
                <input type="number" id="step3" class="bridge-input" inputmode="numeric" pattern="[0-9]*" placeholder="?">
            </div>
            <div id="bridge-hint">Aanvullen tot 10...</div>
        </div>
        <div id="bridge-msg"></div>
        <button class="btn btn-back" onclick="exitGame()">🏠 Hoofdmenu</button>
    </div>

    <!-- LEVEL SELECTIE & GAME SOM VAN 10 -->
    <div id="level-screen" class="screen">
        <h2 id="level-title">Niveau</h2>
        <button class="btn" onclick="startGridGame(6)">🟢 Makkelijk (6x6)</button>
        <button class="btn" onclick="startGridGame(8)">🟡 Gemiddeld (8x8)</button>
        <button class="btn" onclick="startGridGame(10)">🔴 Moeilijk (10x10)</button>
        <button class="btn btn-back" onclick="showScreen('menu-screen')">Terug</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="stats-bar">
            <div class="stat-item">⭐ <span id="stat-score">0</span></div>
            <div class="stat-item">⏱️ <span id="stat-timer">0</span>s</div>
            <div class="stat-item">❌ <span id="stat-errors">0</span></div>
            <div class="stat-item">🏆 <span id="stat-high">0</span></div>
        </div>
        <div id="grid-container"></div>
        
        <!-- Toetsenbord Race -->
        <div id="kb-area" style="display:none; width:100%;">
            <div style="background:white; padding:20px; border-radius:20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
                <span id="num1">?</span> + 
                <input type="number" id="kb-input" inputmode="numeric" pattern="[0-9]*" placeholder="?"> = 10
            </div>
        </div>

        <div id="msg"></div>
        <button id="retry-btn" class="btn" style="background:var(--secondary); color:white; display:none;" onclick="restartCurrentLevel()">🔄 Opnieuw</button>
        <button class="btn btn-back" onclick="exitGame()">🏠 Menu</button>
    </div>

    <script>
        let config = { type: 1, size: 8, cellSize: 0 };
        let state = { score: 0, errors: 0, seconds: 0, lastTime: 0, selected: null, cpuTarget: null, isGameOver: false };
        let timerInterval;
        let grid = [];

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            clearInterval(timerInterval);
        }

        /* --- BRUGMETHODE --- */
        let bData = { n1: 0, n2: 0, s1: 0, s2: 0, tot: 0 };
        function openBrugmethode() { showScreen('bridge-screen'); state.score = 0; state.seconds = 0; document.getElementById('bridge-score').innerText = "0"; newBridgeProblem(); startTimer('bridge-timer'); }
        function newBridgeProblem() {
            bData.n1 = Math.floor(Math.random() * 4) + 6; bData.n2 = Math.floor(Math.random() * 4) + 5;
            bData.s1 = 10 - bData.n1; bData.s2 = bData.n2 - bData.s1; bData.tot = bData.n1 + bData.n2;
            document.getElementById('b-main-n1').innerText = bData.n1; document.getElementById('b-main-n2').innerText = bData.n2;
            document.getElementById('calc-n1').innerText = bData.n1;
            ['step1', 'step2', 'step3'].forEach(id => { const el = document.getElementById(id); el.value = ""; el.classList.remove('correct'); el.disabled = true; });
            
            const s1 = document.getElementById('step1');
            s1.disabled = false;
            setTimeout(() => s1.focus(), 100);
            document.getElementById('bridge-hint').innerText = `Maak 10: ${bData.n1} + ... = 10`;

            s1.oninput = (e) => { if(parseInt(e.target.value) === bData.s1) completeStep(e.target, 'step2', `Splits ${bData.n2}: ${bData.s1} en ...`); };
            document.getElementById('step2').oninput = (e) => { if(parseInt(e.target.value) === bData.s2) completeStep(e.target, 'step3', `Alles samen: 10 + ${bData.s2} = ...`); };
            document.getElementById('step3').oninput = (e) => { if(parseInt(e.target.value) === bData.tot) { 
                e.target.classList.add('correct'); e.target.disabled = true; 
                state.score += 50; document.getElementById('bridge-score').innerText = state.score;
                document.getElementById('bridge-msg').innerText = "Perfect! 🌟";
                setTimeout(() => { document.getElementById('bridge-msg').innerText = ""; newBridgeProblem(); }, 1000);
            }};
        }
        function completeStep(current, nextId, hint) {
            current.classList.add('correct');
            // We zetten hem niet op disabled voor de focus overgang klaar is (mobiel vriendelijk)
            const next = document.getElementById(nextId);
            next.disabled = false;
            next.focus();
            current.disabled = true; 
            document.getElementById('bridge-hint').innerText = hint;
        }

        /* --- SOM VAN 10 --- */
        function openSomVan10() { showScreen('menu-screen'); }
        function showLevelSelect(type) { config.type = type; showScreen('level-screen'); }
        function openKeyboardRace() { 
            config.type = 3; resetState(); showScreen('game-screen'); 
            document.getElementById('grid-container').style.display = 'none'; 
            document.getElementById('kb-area').style.display = 'block'; 
            document.getElementById('retry-btn').style.display = 'none'; 
            initKeyboardGame(); startTimer('stat-timer'); 
        }
        function startGridGame(size) { 
            config.size = size; resetState(); showScreen('game-screen'); 
            document.getElementById('grid-container').style.display = 'block'; 
            document.getElementById('kb-area').style.display = 'none'; 
            document.getElementById('retry-btn').style.display = 'none'; 
            const w = Math.min(window.innerWidth - 40, 460); config.cellSize = Math.floor(w / config.size); 
            initGrid(); startTimer('stat-timer'); 
        }

        function initKeyboardGame() {
            const input = document.getElementById('kb-input');
            const num1El = document.getElementById('num1');
            let n1 = Math.floor(Math.random()*9)+1;
            num1El.innerText = n1;
            input.value = "";
            setTimeout(() => input.focus(), 100);

            input.oninput = () => {
                if (parseInt(input.value) + n1 === 10) {
                    state.score += 50; state.lastTime = Date.now(); updateStatsUI();
                    n1 = Math.floor(Math.random()*9)+1;
                    num1El.innerText = n1;
                    input.value = "";
                    input.focus(); // Forceer focus behoud
                } else if (input.value.length >= 1) {
                    state.errors++; updateStatsUI();
                    input.value = "";
                }
            };
            // Voorkom dat toetsenbord sluit bij toevallige blur
            input.onblur = () => { if(!state.isGameOver && config.type === 3) setTimeout(() => input.focus(), 10); };
        }

        /* --- GRID LOGICA (V2.3 INTEGRAAL) --- */
        function initGrid() {
            const container = document.getElementById('grid-container'); container.innerHTML = '';
            container.style.width = (config.size * config.cellSize) + 'px'; container.style.height = (config.size * config.cellSize) + 'px';
            grid = [];
            let values = []; for (let i = 0; i < (config.size * config.size) / 2; i++) { let v1 = Math.floor(Math.random() * 9) + 1; values.push(v1, 10 - v1); }
            values.sort(() => Math.random() - 0.5);
            let idx = 0;
            for (let r = 0; r < config.size; r++) {
                for (let c = 0; c < config.size; c++) {
                    const val = values[idx++]; const el = document.createElement('div'); el.className = 'cell'; el.innerText = val; el.style.width = (config.cellSize - 4) + 'px'; el.style.height = (config.cellSize - 4) + 'px';
                    const cellObj = { r, c, val, el }; updateCellPosition(cellObj); el.onclick = () => handleCellClick(cellObj); container.appendChild(el); grid.push(cellObj);
                }
            }
            if (config.type === 2) setTimeout(cpuPick, 800);
        }
        function updateCellPosition(cell) { cell.el.style.top = (cell.r * config.cellSize + 2) + 'px'; cell.el.style.left = (cell.c * config.cellSize + 2) + 'px'; }
        
        function handleCellClick(clicked) {
            if (state.isGameOver) return;
            if (config.type === 2) {
                if (state.cpuTarget && (clicked.val + state.cpuTarget.val === 10) && clicked !== state.cpuTarget) {
                    removePair(clicked, state.cpuTarget); state.cpuTarget = null; if(!checkGameOver()) setTimeout(cpuPick, 700);
                } else { state.errors++; updateStatsUI(); }
                return;
            }
            if (!state.selected) { state.selected = clicked; clicked.el.classList.add('selected'); }
            else {
                if (state.selected === clicked) { state.selected.el.classList.remove('selected'); state.selected = null; }
                else if (state.selected.val + clicked.val === 10) { removePair(state.selected, clicked); state.selected = null; checkGameOver(); }
                else { state.errors++; updateStatsUI(); state.selected.el.classList.remove('selected'); state.selected = null; }
            }
        }
        function removePair(c1, c2) {
            const now = Date.now(); state.score += Math.max(10, Math.floor(100 - ((now - state.lastTime)/1000) * 8)); state.lastTime = now; updateStatsUI();
            c1.el.classList.add('exploding'); c2.el.classList.add('exploding');
            setTimeout(() => { c1.el.remove(); c2.el.remove(); grid = grid.filter(c => c !== c1 && c !== c2); if (config.type === 4) { applyGravity(); setTimeout(checkGameOver, 600); } else { checkGameOver(); } }, 300);
        }
        function applyGravity() {
            for (let c = 0; c < config.size; c++) {
                let col = grid.filter(cell => cell.c === c).sort((a, b) => b.r - a.r);
                col.forEach((cell, idx) => { cell.r = (config.size - 1) - idx; updateCellPosition(cell); });
            }
        }
        function cpuPick() { if (state.isGameOver) return; let p = findPairs(); if (p.length > 0) { let rp = p[Math.floor(Math.random()*p.length)]; state.cpuTarget = rp[0]; state.cpuTarget.el.classList.add('cpu-hint'); } }
        function findPairs() { let p = []; for(let i=0; i<grid.length; i++) { for(let j=i+1; j<grid.length; j++) { if(grid[i].val+grid[j].val===10) p.push([grid[i], grid[j]]); } } return p; }
        
        function updateStatsUI() {
            document.getElementById('stat-score').innerText = state.score; document.getElementById('stat-errors').innerText = state.errors; document.getElementById('stat-timer').innerText = state.seconds;
            const key = `rec_v27_${config.type}_${config.size}`; let high = localStorage.getItem(key) || 0; if (state.score > high) { high = state.score; localStorage.setItem(key, high); } document.getElementById('stat-high').innerText = high;
        }
        function startTimer(id) { clearInterval(timerInterval); timerInterval = setInterval(() => { state.seconds++; document.getElementById(id).innerText = state.seconds; }, 1000); }
        function checkGameOver() { if (grid.length === 0 || findPairs().length === 0) { state.isGameOver = true; clearInterval(timerInterval); document.getElementById('msg').innerHTML = grid.length === 0 ? "🎉 GEWONNEN! 🎉" : "⛔ STOP! ⛔"; document.getElementById('retry-btn').style.display = 'flex'; return true; } return false; }
        function exitGame() { state.isGameOver = true; showScreen('main-mode-screen'); }
        function restartCurrentLevel() { if (config.type === 3) openKeyboardRace(); else startGridGame(config.size); }
    </script>
</body>
</html>
