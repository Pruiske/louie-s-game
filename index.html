<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Som van 10 - Game Hub</title>
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2ecc71;
            --danger: #e74c3c;
            --bg: #f4f7f6;
            --text: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        /* Schermen */
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; }
        .active { display: flex; }

        /* Header UI */
        #game-header {
            background: white;
            padding: 15px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Menu */
        .menu-container { text-align: center; }
        .menu-btn {
            display: block;
            width: 300px;
            padding: 15px;
            margin: 10px;
            font-size: 1.1rem;
            background: white;
            border: 2px solid var(--primary);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .menu-btn:hover { background: var(--primary); color: white; }

        /* Grid Layout */
        #grid {
            display: grid;
            grid-template-columns: repeat(10, 45px);
            grid-template-rows: repeat(10, 45px);
            gap: 5px;
            background: #bdc3c7;
            padding: 10px;
            border-radius: 10px;
        }

        .cell {
            width: 45px;
            height: 45px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }
        .cell.selected { background: var(--primary); color: white; transform: scale(1.1); }
        .cell.cpu-selected { background: #f1c40f; color: black; border: 2px solid orange; }
        .cell.hidden { visibility: hidden; pointer-events: none; }

        /* Spel 3: Toetsenbord */
        #kb-game { font-size: 3rem; margin: 40px; }
        #kb-input { border: 3px solid var(--primary); border-radius: 10px; padding: 10px; width: 60px; text-align: center; }

        .btn-back { margin-top: 20px; background: #95a5a6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- HOOFDMENU -->
    <div id="menu-screen" class="screen active">
        <h1>Som van 10</h1>
        <p>Kies een speltype:</p>
        <div class="menu-container">
            <button class="menu-btn" onclick="startGame(1)">1. Klassiek Raster</button>
            <button class="menu-btn" onclick="startGame(2)">2. Computer Kiest</button>
            <button class="menu-btn" onclick="startGame(3)">3. Toetsenbord Race</button>
            <button class="menu-btn" onclick="startGame(4)">4. Gravity Mode</button>
        </div>
    </div>

    <!-- SPEL SCHERM -->
    <div id="game-screen" class="screen">
        <div id="game-header">
            <div>Punten: <span id="score">0</span></div>
            <div>Tijd: <span id="timer">0</span>s</div>
        </div>

        <!-- Container voor de verschillende spellen -->
        <div id="grid-container">
            <div id="grid"></div>
        </div>

        <div id="kb-game-container" style="display:none;">
            <div id="kb-game">
                <span id="num1">5</span> + <input type="text" id="kb-input" maxlength="1" autocomplete="off"> = 10
            </div>
        </div>

        <div id="msg" style="margin-top:15px; font-weight:bold; color:var(--danger);"></div>
        <button class="btn-back" onclick="goToMenu()">Stoppen en Menu</button>
    </div>

    <script>
        let currentGame = 0;
        let score = 0;
        let seconds = 0;
        let timerInterval;
        let lastActionTime = 0;
        let selectedCell = null;
        let cpuTargetIndex = null;
        let gridData = []; // 2D array voor Gravity

        const gridElement = document.getElementById('grid');
        const kbContainer = document.getElementById('kb-game-container');
        const gridUIContainer = document.getElementById('grid-container');

        function startGame(type) {
            currentGame = type;
            score = 0;
            seconds = 0;
            lastActionTime = Date.now();
            document.getElementById('score').innerText = '0';
            document.getElementById('timer').innerText = '0';
            document.getElementById('msg').innerText = '';
            
            showScreen('game-screen');
            
            if (type === 3) {
                gridUIContainer.style.display = 'none';
                kbContainer.style.display = 'block';
                setupKeyboardGame();
            } else {
                gridUIContainer.style.display = 'block';
                kbContainer.style.display = 'none';
                initGrid();
            }

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                document.getElementById('timer').innerText = seconds;
            }, 1000);
        }

        function initGrid() {
            gridElement.innerHTML = '';
            gridData = [];
            
            // Maak 10x10 data model
            for (let r = 0; r < 10; r++) {
                gridData[r] = [];
                for (let c = 0; c < 10; c++) {
                    gridData[r][c] = Math.floor(Math.random() * 9) + 1;
                }
            }
            renderGrid();
            if (currentGame === 2) cpuPick();
        }

        function renderGrid() {
            gridElement.innerHTML = '';
            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 10; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    if (gridData[r][c] === 0) {
                        cell.classList.add('hidden');
                    } else {
                        cell.innerText = gridData[r][c];
                        cell.dataset.r = r;
                        cell.dataset.c = c;
                        cell.onclick = () => handleCellClick(r, c, cell);
                    }
                    gridElement.appendChild(cell);
                }
            }
        }

        function handleCellClick(r, c, cell) {
            const val = gridData[r][c];

            if (currentGame === 2) {
                // Modus 2: Speler moet partner van CPU kiezen
                const targetVal = gridData[Math.floor(cpuTargetIndex/10)][cpuTargetIndex%10];
                if (val + targetVal === 10) {
                    addScore();
                    gridData[r][c] = 0;
                    gridData[Math.floor(cpuTargetIndex/10)][cpuTargetIndex%10] = 0;
                    renderGrid();
                    if (!checkGameOver()) cpuPick();
                }
                return;
            }

            // Modus 1 & 4: Zelf paren kiezen
            if (!selectedCell) {
                selectedCell = { r, c, cell };
                cell.classList.add('selected');
            } else {
                const val1 = gridData[selectedCell.r][selectedCell.c];
                const val2 = gridData[r][c];

                if (val1 + val2 === 10 && (selectedCell.r !== r || selectedCell.c !== c)) {
                    addScore();
                    gridData[selectedCell.r][selectedCell.c] = 0;
                    gridData[r][c] = 0;
                    
                    if (currentGame === 4) applyGravity();
                    
                    selectedCell = null;
                    renderGrid();
                    checkGameOver();
                } else {
                    document.querySelectorAll('.cell').forEach(el => el.classList.remove('selected'));
                    selectedCell = null;
                }
            }
        }

        function cpuPick() {
            // Zoek alle mogelijke paren
            let pairs = [];
            for(let r=0; r<10; r++){
                for(let c=0; c<10; c++){
                    if(gridData[r][c] === 0) continue;
                    for(let r2=0; r2<10; r2++){
                        for(let c2=0; c2<10; c2++){
                            if(r===r2 && c===c2) continue;
                            if(gridData[r2][c2] !== 0 && gridData[r][c] + gridData[r2][c2] === 10) {
                                pairs.push(r * 10 + c);
                            }
                        }
                    }
                }
            }

            if(pairs.length > 0) {
                cpuTargetIndex = pairs[Math.floor(Math.random() * pairs.length)];
                setTimeout(() => {
                    const cells = document.querySelectorAll('.cell');
                    cells.forEach(cell => {
                        if(cell.dataset.r == Math.floor(cpuTargetIndex/10) && cell.dataset.c == cpuTargetIndex%10) {
                            cell.classList.add('cpu-selected');
                        }
                    });
                }, 100);
            }
        }

        function applyGravity() {
            for (let c = 0; c < 10; c++) {
                let emptyRow = 9;
                for (let r = 9; r >= 0; r--) {
                    if (gridData[r][c] !== 0) {
                        let temp = gridData[r][c];
                        gridData[r][c] = 0;
                        gridData[emptyRow][c] = temp;
                        emptyRow--;
                    }
                }
            }
        }

        // SPEL 3 LOGICA
        function setupKeyboardGame() {
            const input = document.getElementById('kb-input');
            const num1El = document.getElementById('num1');
            let n1 = Math.floor(Math.random() * 9) + 1;
            num1El.innerText = n1;
            input.value = '';
            input.focus();

            input.oninput = () => {
                let val = parseInt(input.value);
                if (val + n1 === 10) {
                    addScore();
                    n1 = Math.floor(Math.random() * 9) + 1;
                    num1El.innerText = n1;
                    input.value = '';
                } else if (input.value.length > 0) {
                    input.value = ''; // Foutief? Reset veld
                }
            };
        }

        function addScore() {
            const now = Date.now();
            const diff = (now - lastActionTime) / 1000;
            const points = Math.max(10, Math.floor(100 - (diff * 7)));
            score += points;
            document.getElementById('score').innerText = score;
            lastActionTime = now;
        }

        function checkGameOver() {
            let possible = false;
            let count = 0;
            for(let r=0; r<10; r++) {
                for(let c=0; c<10; c++) {
                    if(gridData[r][c] === 0) continue;
                    count++;
                    for(let r2=0; r2<10; r2++) {
                        for(let c2=0; c2<10; c2++) {
                            if(r===r2 && c===c2) continue;
                            if(gridData[r2][c2] !== 0 && gridData[r][c] + gridData[r2][c2] === 10) possible = true;
                        }
                    }
                }
            }

            if (!possible) {
                clearInterval(timerInterval);
                document.getElementById('msg').innerText = count === 0 ? "GEWONNEN! Veld is leeg." : "GAME OVER! Geen zetten meer.";
                return true;
            }
            return false;
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goToMenu() {
            clearInterval(timerInterval);
            showScreen('menu-screen');
        }
    </script>
</body>
</html>
